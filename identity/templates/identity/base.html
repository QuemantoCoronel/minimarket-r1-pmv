<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}R1-PMV — Minimarket{% endblock %}</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; color: #111827; background: #f9fafb; }
    body { margin: 0; padding: 0; }
    .skip-link { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }
    .skip-link:focus { position: static; width: auto; height: auto; padding: 0.5rem 1rem; background: #1d4ed8; color: #fff; display: inline-block; }
    header { background: #1f2937; color: #ffffff; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header a { color: #93c5fd; text-decoration: underline; font-weight: 600; }
    header a:focus-visible, button:focus-visible, input:focus-visible, main a:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    main { max-width: 42rem; margin: 2rem auto; padding: 1.5rem; background: #ffffff; border: 1px solid #d1d5db; border-radius: 0.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    .form-group input { width: 100%; max-width: 24rem; padding: 0.5rem; border: 1px solid #6b7280; border-radius: 0.25rem; font-size: 1rem; }
    .alert-error { background: #fef2f2; border-left: 4px solid #dc2626; color: #991b1b; padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 0.25rem; }
    .btn-primary { background: #1d4ed8; color: #ffffff; border: none; padding: 0.6rem 1.2rem; font-size: 1rem; font-weight: 600; border-radius: 0.25rem; cursor: pointer; }
    .btn-primary:hover { background: #1e40af; }
    .role-nav ul { list-style: none; padding: 0; display: flex; gap: 1rem; flex-wrap: wrap; }
    .role-nav a { display: inline-block; padding: 0.6rem 1rem; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; border-radius: 0.25rem; text-decoration: none; font-weight: 600; }
    .role-badge { background: #374151; padding: 0.2rem 0.6rem; border-radius: 0.25rem; font-family: monospace; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
  <header role="banner">
    <h1>R1-PMV</h1>
    {% if user.is_authenticated %}
      <div id="session-user-bar" data-role="{{ user.role.code }}">
        <span>Sesión de <strong>{{ user.display_name }}</strong> · <span class="role-badge" id="user-role-badge">{{ user.role.code }}</span></span>
        | <a href="{% url 'logout' %}" id="nav-logout-link">Salir</a>
      </div>
    {% endif %}
  </header>
  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
