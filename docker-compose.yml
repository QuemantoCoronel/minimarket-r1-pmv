version: '3.8'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: minimarket_test
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d minimarket_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: python:3.12-slim
    command: python -m http.server 8000
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
