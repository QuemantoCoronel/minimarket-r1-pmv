services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/Lima}
      PGTZ: ${TZ:-America/Lima}
      POSTGRES_DB: ${POSTGRES_DB:-r1_pmv_db}
      POSTGRES_USER: ${POSTGRES_USER:-r1_pmv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-r1_pmv_local_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-r1_pmv_user} -d ${POSTGRES_DB:-r1_pmv_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/Lima}
      POSTGRES_HOST: db
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "if [ -f manage.py ]; then
               python manage.py migrate --noinput &&
               python manage.py runserver 0.0.0.0:8000;
             else
               echo 'Esperando manage.py de S1-ARQ-01... Contenedor listo.' &&
               tail -f /dev/null;
             fi"

volumes:
  postgres_data: